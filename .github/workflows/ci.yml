name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    if: github.event.pull_request.head.repo.fork == false && github.event.pull_request.base.ref == 'prod'
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  changesets:
    if: github.event.pull_request.head.repo.fork == false && github.event.pull_request.base.ref == 'prod'
    name: Changesets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Not `changeset status`: the beta release moves versioned changesets into .changeset/pre/, which it
      # doesn't count as pending, so it fails every release PR.
      - name: Require a changeset for the release
        run: |
          if ! find .changeset -maxdepth 2 -name '*.md' ! -name README.md | grep -q .; then
            echo "::error::Nothing to release: no changeset in .changeset/ or .changeset/pre/. Add one with pnpm changeset."
            exit 1
          fi

  checks:
    if: github.event.pull_request.head.repo.fork == true
    uses: ./.github/workflows/checks.yml

  tests:
    if: github.event.pull_request.head.repo.fork == true
    uses: ./.github/workflows/test.yml

  build:
    if: github.event.pull_request.head.repo.fork == true
    uses: ./.github/workflows/build.yml
