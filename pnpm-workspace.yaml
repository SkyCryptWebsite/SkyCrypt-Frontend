allowBuilds:
  "@prisma/client": false
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  protobufjs: false
  sharp: true
  simple-git-hooks: true

updateConfig:
  ignoreDependencies:
    - typescript

publicHoistPattern:
  - "@takumi-rs/core-*"

permissions:
  "@sveltejs/vite-devtools-svelte":
    skills: [vite-devtools-svelte-perf-audit, vite-devtools-svelte-perf-fix]
  "@tanstack/svelte-table":
    skills: true

skills:
  dirs:
    - .github/skills
